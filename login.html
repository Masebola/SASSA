<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — SASSA Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="nav-brand" href="index.html">
      <span class="brand-mark">SA</span>
      <span>SASSA Services</span>
    </a>
    <button class="nav-toggle" data-nav-toggle aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" data-nav-links>
      <li><a href="index.html">Home</a></li>
      <li data-nav-guest style="display:flex; gap:14px; align-items:center;">
        <a href="login.html" class="active">Log in</a>
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </li>
      <li data-nav-member style="display:none; gap:14px; align-items:center;">
        <a href="dashboard.html">Dashboard</a>
        <a href="#" data-logout class="btn btn-outline btn-sm">Log out</a>
      </li>
    </ul>
  </nav>
</header>

<section class="section">
  <div class="container form-shell">
    <h1 class="text-center">Sign in</h1>
    <p class="text-center">Access your applications, payments and notifications.</p>

    <div id="form-message" class="form-message" role="alert"></div>

    <form id="login-form" class="card stack">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="text-center" style="margin-top:16px;">
      Don't have an account yet? <a href="register.html">Register</a>
    </p>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-inner">
      <span>© 2026 SASSA Services. All rights reserved.</span>
    </div>
</footer>

<script type="module" src="js/nav.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
