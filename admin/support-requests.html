<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support Requests — SASSA Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="nav-brand" href="dashboard.html">
      <span class="brand-mark">SA</span>
      <span>SASSA Administration</span>
    </a>
    <button class="nav-toggle" data-nav-toggle aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" data-nav-links>
      <li><a href="dashboard.html">Applications</a></li>
      <li><a href="#" data-logout="../index.html">Log out</a></li>
    </ul>
  </nav>
</header>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="dashboard.html">Applications</a>
    <a href="beneficiaries.html">Beneficiaries</a>
    <a href="support-requests.html" class="active">Support requests</a>
  </aside>

  <main class="admin-main">
    <div class="dash-header">
      <div>
        <h1 class="mb-0">Support Requests</h1>
        <p class="dash-welcome mb-0">Enquiries, problem reports, and appeals from beneficiaries.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="table-toolbar" style="margin-bottom:0;">
        <input type="text" id="search-input" placeholder="Search by name, reference or details" />
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="submitted">Submitted</option>
          <option value="under_review">Under review</option>
          <option value="responded">Responded</option>
          <option value="closed">Closed</option>
        </select>
      </div>
    </div>

    <div id="requests-container">
      <div class="card empty-state"><p>Loading requests…</p></div>
    </div>
  </main>
</div>

<script type="module" src="../js/nav.js"></script>
<script type="module" src="support-requests.js"></script>
</body>
</html>
