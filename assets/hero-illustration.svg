<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of a person applying for services on a laptop</title>

  <!-- background blob -->
  <circle cx="290" cy="260" r="230" fill="#E7F0EA"/>

  <!-- decorative dots -->
  <circle cx="95" cy="95" r="8" fill="#C89B3C" opacity="0.55"/>
  <circle cx="475" cy="130" r="6" fill="#1B5E3C" opacity="0.35"/>
  <circle cx="495" cy="400" r="10" fill="#C89B3C" opacity="0.45"/>

  <!-- stool -->
  <rect x="122" y="336" width="56" height="10" rx="4" fill="#DCD6C9"/>

  <!-- person -->
  <path d="M108 340 Q108 266 150 266 Q192 266 192 340 Z" fill="#1B5E3C"/>
  <circle cx="150" cy="228" r="30" fill="#1B2A3A"/>

  <!-- laptop base -->
  <rect x="175" y="330" width="220" height="14" rx="7" fill="#1B2A3A"/>
  <!-- laptop screen -->
  <rect x="195" y="180" width="180" height="130" rx="10" fill="#1B2A3A"/>
  <rect x="205" y="190" width="160" height="110" rx="6" fill="#1B5E3C"/>
  <!-- screen content lines -->
  <rect x="217" y="204" width="90" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="217" y="222" width="120" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
  <rect x="217" y="240" width="70" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
  <rect x="217" y="262" width="60" height="22" rx="6" fill="#C89B3C"/>

  <!-- floating document card -->
  <g transform="translate(368,110) rotate(8)">
    <rect x="0" y="0" width="92" height="112" rx="10" fill="#ffffff" stroke="#DCD6C9" stroke-width="2"/>
    <rect x="14" y="18" width="64" height="8" rx="4" fill="#1B5E3C"/>
    <rect x="14" y="36" width="50" height="6" rx="3" fill="#DCD6C9"/>
    <rect x="14" y="50" width="50" height="6" rx="3" fill="#DCD6C9"/>
    <rect x="14" y="64" width="34" height="6" rx="3" fill="#DCD6C9"/>
    <circle cx="46" cy="90" r="14" fill="#C89B3C"/>
    <path d="M39 90 l5 5 l10 -10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- notification badge -->
  <g transform="translate(430,300)">
    <circle cx="0" cy="0" r="27" fill="#ffffff" stroke="#DCD6C9" stroke-width="2"/>
    <path d="M-8 5 Q-8 -9 0 -9 Q8 -9 8 5 L10 9 L-10 9 Z" fill="#1B5E3C"/>
    <circle cx="0" cy="13" r="3" fill="#1B5E3C"/>
    <circle cx="11" cy="-11" r="6" fill="#C89B3C"/>
  </g>

  <!-- payment badge -->
  <g transform="translate(118,430)">
    <circle cx="0" cy="0" r="29" fill="#FBF2DE" stroke="#C89B3C" stroke-width="2"/>
    <text x="0" y="9" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#92710A" text-anchor="middle">R</text>
  </g>
</svg>
